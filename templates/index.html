<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الثانوية العامة</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>نتيجة الثانوية العامة</h1>
            <p>ابحث برقم الجلوس أو الاسم</p>
        </header>

        <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 1.5rem;">
            <a href="https://github.com/AnasFahiem" target="_blank" rel="noopener noreferrer" class="dev-link">
                Developed by AnasFahiem
            </a>
            <a href="https://wa.me/qr/XTVA3OPTMKD6J1" target="_blank" rel="noopener noreferrer" class="social-icon" title="تواصل عبر واتساب">
                <svg viewBox="0 0 24 24" width="22" height="22">
                    <path fill="#25D366" d="M12.031 0C5.405 0 0 5.4 0 12.019c0 2.115.549 4.184 1.597 6.012L.15 23.36l5.485-1.439a11.954 11.954 0 006.396 1.836h.005c6.623 0 12.026-5.4 12.026-12.019 0-3.21-1.25-6.228-3.518-8.497A11.916 11.916 0 0012.031 0zm0 21.758a9.929 9.929 0 01-5.068-1.385l-.364-.216-3.766.988.995-3.668-.236-.376a9.92 9.92 0 01-1.52-5.34C2.069 6.516 6.545 2.05 12.035 2.05c2.658 0 5.158 1.036 7.037 2.915a9.917 9.917 0 012.91 7.035c-.001 5.484-4.477 9.958-9.951 9.958zm5.452-7.447c-.299-.15-1.768-.871-2.043-.97-.275-.099-.476-.15-.676.15-.2.299-.773.97-.946 1.168-.175.2-.349.225-.648.075-.299-.15-1.261-.465-2.404-1.485-.889-.794-1.488-1.776-1.663-2.075-.175-.299-.019-.462.13-.611.134-.134.299-.349.449-.524.15-.175.2-.299.299-.499.099-.2.05-.374-.025-.524-.075-.15-.676-1.626-.926-2.226-.244-.585-.492-.505-.676-.514-.175-.01-.375-.01-.575-.01s-.524.075-.798.374c-.275.299-1.048 1.023-1.048 2.493s1.073 2.893 1.222 3.092c.15.2 2.109 3.22 5.109 4.512.714.308 1.27.492 1.705.629.715.228 1.365.196 1.88.119.578-.087 1.768-.722 2.018-1.42.25-.698.25-1.296.175-1.42-.075-.125-.275-.2-.575-.35z"></path>
                </svg>
            </a>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="أدخل رقم الجلوس أو الاسم هنا..." onkeypress="handleKeyPress(event)">
            <button onclick="performSearch()">بحث</button>
        </div>

        <div id="loading" class="hidden">جاري البحث...</div>
        
        <div id="resultsContainer"></div>
    </div>

    <script>
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const loading = document.getElementById('loading');
            const resultsContainer = document.getElementById('resultsContainer');

            loading.classList.remove('hidden');
            resultsContainer.innerHTML = '';

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data.length === 0) {
                    resultsContainer.innerHTML = '<div class="no-results">لا توجد نتائج مطابقة لبحثك</div>';
                } else {
                    data.forEach(student => {
                        const card = document.createElement('div');
                        card.className = 'result-card';
                        
                        const degree = parseFloat(student.total_degree);
                        const percentage = !isNaN(degree) ? ((degree / 320) * 100).toFixed(2) + '%' : '-';

                        card.innerHTML = `
                            <div class="card-header">
                                <h2>${student.arabic_name}</h2>
                                <span class="seat-no">رقم الجلوس: ${student.seating_no}</span>
                            </div>
                            <div class="card-details">
                                <div class="detail-item">
                                    <span class="label">المجموع:</span>
                                    <span class="value score">${student.total_degree}</span>
                                </div>
                                <div class="detail-item">
                                    <span class="label">النسبة المئوية:</span>
                                    <span class="value score" style="color: #27ae60;" dir="ltr">${percentage}</span>
                                </div>
                                <div class="detail-item">
                                    <span class="label">الحالة:</span>
                                    <span class="value status ${student.student_case_desc && student.student_case_desc.includes('ناجح') ? 'success' : 'other'}">${student.student_case_desc}</span>
                                </div>
                            </div>
                        `;
                        resultsContainer.appendChild(card);
                    });
                }
            } catch (error) {
                console.error("Error fetching data:", error);
                resultsContainer.innerHTML = '<div class="no-results error">حدث خطأ أثناء البحث. يرجى المحاولة مرة أخرى.</div>';
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
